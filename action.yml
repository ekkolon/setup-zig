name: Setup Zig Toolchain
description: Install Zig with verified downloads and compiler and build caching
author: Nelson Dominguez
branding:
  icon: zap
  color: orange
inputs:
  version:
    description: Zig version, semver range, latest, or master. Defaults to latest when version-file is unset.
  version-file:
    description: Path to a version file, .tool-versions, or build.zig.zon, relative to the workspace.
  architecture:
    description: Compiler architecture (x64, arm64, or x86). Defaults to the action runtime architecture.
  check-latest:
    description: Refresh the version index before resolving a range or master. Exact pins never use the index.
    default: 'false'
  checksum:
    description: Optional SHA-256 digest of the compiler archive, checked in addition to its minisign signature.
  mirror:
    description: Use one HTTPS community mirror instead of the published mirror list.
  cache:
    description: Restore and save the Zig global cache, including packages and compilation results.
    default: 'true'
  cache-toolchain:
    description: Cache signed compiler archives and download metadata in GitHub Actions cache.
    default: 'true'
  cache-read-only:
    description: Restore Actions caches without saving new entries.
    default: 'false'
  cache-key:
    description: Additional build-cache scope, such as a matrix configuration or project name.
  cache-dependency-path:
    description: Newline-separated dependency-file glob patterns, relative to the workspace. Defaults to **/build.zig.zon.
  cache-size-limit:
    description: Maximum global cache upload size in MiB (1 to 10240). Oversized caches are left on disk.
    default: '2048'
outputs:
  version:
    description: Exact installed Zig version, including the development commit hash.
  zig-path:
    description: Directory containing the Zig executable.
  sha256:
    description: SHA-256 of the verified compiler archive.
  toolchain-cache-hit:
    description: Whether the signed compiler archive came from the runner or Actions cache.
  cache-hit:
    description: Whether the build cache matched the exact primary key.
  global-cache-dir:
    description: Zig global cache directory configured by the action, or the existing environment value when caching is disabled.
runs:
  using: node24
  main: dist/main.js
  post: dist/post.js
  post-if: success()
